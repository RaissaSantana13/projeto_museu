name: CI/CD Pipeline

on:
  push:
    branches: ['main']
    paths:
      - 'next_museu/**'
  pull_request:
    branches: ['main']
    paths:
      - 'next_museu/**'

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/museu-frontend

jobs:
  
  frontend-validation:
    name: Frontend (Next.js) - Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./next_museu

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci --force

      # - name: Checagem de Lint
      #   run: npm run lint

      - name: Testes Unitários
        run: npm run test -- --passWithNoTests

      - name: Validação do Build TypeScript
        run: npm run build
  
  docker-publish-api:
    name: Build and Push Docker Image
    needs: [frontend-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticação no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir e Publicar Imagem
        uses: docker/build-push-action@v6
        with:
          context: ./next_museu
          file: ./next_museu/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.run_number }}    
